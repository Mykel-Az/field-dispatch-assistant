openapi: 3.0.3
info:
  title: Field Dispatch Assistant API
  version: 1.0.0
  description: API documentation for the Field Dispatch Assistant project.
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      description: Health check endpoint to verify the API is running.
      tags:
      - health
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/skills/:
    get:
      operationId: skills_list
      description: API endpoint that allows skills to be viewed or created.
      tags:
      - skills
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
          description: ''
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Skill:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
      required:
      - id
      - name
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
