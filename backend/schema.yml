openapi: 3.0.3
info:
  title: Field Dispatch Assistant API
  version: 1.0.0
  description: API documentation for the Field Dispatch Assistant project.
paths:
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Get a CSRF token. Responds with 204 No Content.
      tags:
      - auth
      security:
      - sessionAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Health check endpoint to verify the API is running.
      tags:
      - health
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/jobs/:
    get:
      operationId: jobs_list
      description: |-
        Dispatchers and heads manage jobs. There is no DELETE: terminal jobs
        stay for the audit trail. Technicians get their own endpoint in Sprint 2.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: scheduled_date
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          enum:
          - unassigned
          - assigned
          - ongoing
          - completed
          - incomplete
          - failed
          - canceled
          type: string
          minLength: 1
        description: |-
          * `unassigned` - Unassigned
          * `assigned` - Assigned
          * `ongoing` - Ongoing
          * `completed` - Completed
          * `incomplete` - Incomplete
          * `failed` - Failed
          * `canceled` - Canceled
      - in: query
        name: technician
        schema:
          type: integer
          minimum: 1
      tags:
      - jobs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobList'
          description: ''
    post:
      operationId: jobs_create
      description: |-
        Dispatchers and heads manage jobs. There is no DELETE: terminal jobs
        stay for the audit trail. Technicians get their own endpoint in Sprint 2.
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobCreate'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
          description: ''
  /api/jobs/{id}/:
    get:
      operationId: jobs_retrieve
      description: |-
        Dispatchers and heads manage jobs. There is no DELETE: terminal jobs
        stay for the audit trail. Technicians get their own endpoint in Sprint 2.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - jobs
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
          description: ''
    patch:
      operationId: jobs_partial_update
      description: |-
        Dispatchers and heads manage jobs. There is no DELETE: terminal jobs
        stay for the audit trail. Technicians get their own endpoint in Sprint 2.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJobUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJobUpdate'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
          description: ''
  /api/jobs/{id}/cancel/:
    post:
      operationId: jobs_cancel_create
      description: |-
        Dispatchers and heads manage jobs. There is no DELETE: terminal jobs
        stay for the audit trail. Technicians get their own endpoint in Sprint 2.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCancel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobCancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobCancel'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
          description: ''
  /api/organization/:
    get:
      operationId: organization_retrieve
      description: The requester's own organization. There is no id in the URL on
        purpose.
      tags:
      - organization
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
    patch:
      operationId: organization_partial_update
      description: The requester's own organization. There is no id in the URL on
        purpose.
      tags:
      - organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/skills/:
    get:
      operationId: skills_list
      description: API endpoint that allows skills to be viewed or created.
      tags:
      - skills
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
          description: ''
  /api/technicians/:
    get:
      operationId: technicians_list
      description: Dispatchers and heads read technicians; only heads edit them.
      tags:
      - technicians
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechnicianDetail'
          description: ''
  /api/technicians/{id}/:
    get:
      operationId: technicians_retrieve
      description: Dispatchers and heads read technicians; only heads edit them.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this technician.
        required: true
      tags:
      - technicians
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicianDetail'
          description: ''
    patch:
      operationId: technicians_partial_update
      description: Dispatchers and heads read technicians; only heads edit them.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this technician.
        required: true
      tags:
      - technicians
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTechnicianUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTechnicianUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTechnicianUpdate'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicianDetail'
          description: ''
  /api/users/:
    get:
      operationId: users_list
      description: Head dispatchers manage the users of their own organization.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - users
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: users_create
      description: Head dispatchers manage the users of their own organization.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffCreate'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/{id}/:
    get:
      operationId: users_retrieve
      description: Head dispatchers manage the users of their own organization.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom user.
        required: true
      tags:
      - users
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_partial_update
      description: Head dispatchers manage the users of their own organization.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/{id}/deactivate/:
    post:
      operationId: users_deactivate_create
      description: Head dispatchers manage the users of their own organization.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom user.
        required: true
      tags:
      - users
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/{id}/reactivate/:
    post:
      operationId: users_reactivate_create
      description: Head dispatchers manage the users of their own organization.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom user.
        required: true
      tags:
      - users
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/{id}/set-password/:
    post:
      operationId: users_set_password_create
      description: Head dispatchers manage the users of their own organization.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this custom user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPassword'
        required: true
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    CategoryEnum:
      enum:
      - hvac
      - electrical
      - appliance
      type: string
      description: |-
        * `hvac` - HVAC
        * `electrical` - Electrical
        * `appliance` - Appliance repair
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
    GeocodeStatusEnum:
      enum:
      - pending
      - ok
      - approximate
      - manual
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `ok` - OK
        * `approximate` - Approximate
        * `manual` - Manual
        * `failed` - Failed
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Job:
      type: object
      description: 'The list row. No lat/lng on purpose: nobody types or reads coordinates.'
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        postal_code:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        is_urgent:
          type: boolean
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          default: unassigned
        technician:
          allOf:
          - $ref: '#/components/schemas/JobTechnician'
          readOnly: true
        scheduled_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        slot_start:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        slot_end:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        geocode_status:
          allOf:
          - $ref: '#/components/schemas/GeocodeStatusEnum'
          readOnly: true
        location_label:
          type: string
          readOnly: true
      required:
      - address
      - category
      - customer_name
      - geocode_status
      - id
      - is_urgent
      - location_label
      - postal_code
      - scheduled_date
      - slot_end
      - slot_start
      - status
      - technician
      - title
    JobCancel:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required:
      - reason
    JobCreate:
      type: object
      description: POST /jobs/. No organization, status, technician, version or lat/lng.
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
        customer_name:
          type: string
          maxLength: 50
        customer_phone:
          nullable: true
          oneOf:
          - type: string
            pattern: ^\+?[0-9\s().-]{7,20}$
            maxLength: 20
          - type: string
            maxLength: 0
        category:
          $ref: '#/components/schemas/CategoryEnum'
        is_urgent:
          type: boolean
        address:
          type: string
          maxLength: 255
        postal_code:
          type: string
          maxLength: 10
        slot_start:
          type: string
          format: date-time
          nullable: true
        slot_end:
          type: string
          format: date-time
          nullable: true
        estimated_duration_minutes:
          type: integer
          maximum: 1440
          minimum: 1
        skill_ids:
          type: array
          items:
            type: integer
      required:
      - address
      - category
      - customer_name
      - postal_code
      - title
    JobDetail:
      type: object
      description: 'The list row. No lat/lng on purpose: nobody types or reads coordinates.'
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        postal_code:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        is_urgent:
          type: boolean
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          default: unassigned
        technician:
          allOf:
          - $ref: '#/components/schemas/JobTechnician'
          readOnly: true
        scheduled_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        slot_start:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        slot_end:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        geocode_status:
          allOf:
          - $ref: '#/components/schemas/GeocodeStatusEnum'
          readOnly: true
        location_label:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        customer_phone:
          type: string
          readOnly: true
          nullable: true
        estimated_duration_minutes:
          type: integer
          readOnly: true
        acceptable_skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillBrief'
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/JobHistory'
          readOnly: true
      required:
      - acceptable_skills
      - address
      - category
      - created_at
      - customer_name
      - customer_phone
      - description
      - estimated_duration_minutes
      - geocode_status
      - history
      - id
      - is_urgent
      - location_label
      - postal_code
      - scheduled_date
      - slot_end
      - slot_start
      - status
      - technician
      - title
      - version
    JobHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        from_status:
          type: string
          readOnly: true
        to_status:
          allOf:
          - $ref: '#/components/schemas/ToStatusEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
        changed_by:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - changed_by
      - created_at
      - from_status
      - id
      - reason
      - to_status
    JobTechnician:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
      required:
      - full_name
      - id
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Organization:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          oneOf:
          - type: string
            pattern: ^\+?[0-9\s().-]{7,20}$
            maxLength: 20
          - type: string
            maxLength: 0
        address:
          type: string
          maxLength: 255
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          nullable: true
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          nullable: true
        geocode_status:
          allOf:
          - $ref: '#/components/schemas/GeocodeStatusEnum'
          readOnly: true
        work_start:
          type: string
          format: time
          nullable: true
        work_end:
          type: string
          format: time
          nullable: true
        scoring_strategy:
          $ref: '#/components/schemas/ScoringStrategyEnum'
        is_configured:
          type: boolean
          readOnly: true
        version:
          type: integer
          minimum: 1
      required:
      - geocode_status
      - id
      - is_configured
      - name
      - version
    OrganizationSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name
    PaginatedJobList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Job'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedJobUpdate:
      type: object
      description: PATCH /jobs/{id}/. `version` is required. Status and technician
        never change here.
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
        customer_name:
          type: string
          maxLength: 50
        customer_phone:
          nullable: true
          oneOf:
          - type: string
            pattern: ^\+?[0-9\s().-]{7,20}$
            maxLength: 20
          - type: string
            maxLength: 0
        category:
          $ref: '#/components/schemas/CategoryEnum'
        is_urgent:
          type: boolean
        address:
          type: string
          maxLength: 255
        postal_code:
          type: string
          maxLength: 10
        slot_start:
          type: string
          format: date-time
          nullable: true
        slot_end:
          type: string
          format: date-time
          nullable: true
        estimated_duration_minutes:
          type: integer
          maximum: 1440
          minimum: 1
        skill_ids:
          type: array
          items:
            type: integer
        version:
          type: integer
          minimum: 1
    PatchedOrganization:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          oneOf:
          - type: string
            pattern: ^\+?[0-9\s().-]{7,20}$
            maxLength: 20
          - type: string
            maxLength: 0
        address:
          type: string
          maxLength: 255
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          nullable: true
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          nullable: true
        geocode_status:
          allOf:
          - $ref: '#/components/schemas/GeocodeStatusEnum'
          readOnly: true
        work_start:
          type: string
          format: time
          nullable: true
        work_end:
          type: string
          format: time
          nullable: true
        scoring_strategy:
          $ref: '#/components/schemas/ScoringStrategyEnum'
        is_configured:
          type: boolean
          readOnly: true
        version:
          type: integer
          minimum: 1
    PatchedTechnicianUpdate:
      type: object
      description: PATCH /technicians/{id}/. No user, organization or coordinates
        here.
      properties:
        skill_ids:
          type: array
          items:
            type: integer
        shift_start:
          type: string
          format: time
        shift_end:
          type: string
          format: time
        phone:
          nullable: true
          oneOf:
          - type: string
            pattern: ^\+?[0-9\s().-]{7,20}$
            maxLength: 20
          - type: string
            maxLength: 0
    PatchedUserUpdate:
      type: object
      description: PATCH /users/{id}/ accepts full_name only; anything else is a 400.
      properties:
        full_name:
          type: string
          maxLength: 150
    Register:
      type: object
      properties:
        organization_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        full_name:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - email
      - full_name
      - organization_name
      - password
    RoleEnum:
      enum:
      - head_dispatcher
      - dispatcher
      - technician
      type: string
      description: |-
        * `head_dispatcher` - Head Dispatcher
        * `dispatcher` - Dispatcher
        * `technician` - Technician
    ScoringStrategyEnum:
      enum:
      - balanced
      type: string
      description: '* `balanced` - Balanced'
    SetPassword:
      type: object
      properties:
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
    Skill:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
      required:
      - id
      - name
    SkillBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    StaffCreate:
      type: object
      description: Input for POST /users/. There is deliberately no `organization`
        field.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        full_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        technician:
          $ref: '#/components/schemas/TechnicianInput'
      required:
      - email
      - full_name
      - password
      - role
    StatusEnum:
      enum:
      - unassigned
      - assigned
      - ongoing
      - completed
      - incomplete
      - failed
      - canceled
      type: string
      description: |-
        * `unassigned` - Unassigned
        * `assigned` - Assigned
        * `ongoing` - Ongoing
        * `completed` - Completed
        * `incomplete` - Incomplete
        * `failed` - Failed
        * `canceled` - Canceled
    TechnicianDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
          readOnly: true
        shift_start:
          type: string
          format: time
          readOnly: true
        shift_end:
          type: string
          format: time
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
      required:
      - id
      - phone
      - shift_end
      - shift_start
      - skills
      - user
    TechnicianInput:
      type: object
      properties:
        skill_ids:
          type: array
          items:
            type: integer
        shift_start:
          type: string
          format: time
        shift_end:
          type: string
          format: time
      required:
      - shift_end
      - shift_start
      - skill_ids
    ToStatusEnum:
      enum:
      - unassigned
      - assigned
      - ongoing
      - completed
      - incomplete
      - failed
      - canceled
      type: string
      description: |-
        * `unassigned` - Unassigned
        * `assigned` - Assigned
        * `ongoing` - Ongoing
        * `completed` - Completed
        * `incomplete` - Incomplete
        * `failed` - Failed
        * `canceled` - Canceled
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        organization:
          allOf:
          - $ref: '#/components/schemas/OrganizationSummary'
          readOnly: true
      required:
      - email
      - full_name
      - id
      - is_active
      - organization
      - role
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
