openapi: 3.0.3
info:
  title: Field Dispatch Assistant API
  version: 1.0.0
  description: API documentation for the Field Dispatch Assistant project.
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      description: Health check endpoint to verify the API is running.
      tags:
      - health
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/skills/:
    get:
      operationId: skills_retrieve
      description: Endpoint to retrieve a list of skills.
      tags:
      - skills
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
